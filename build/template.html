<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--HOSTED_START-->
<title>Inventory Audit Formatter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>
/* =====================================================================
   INVENTORY AUDIT REPORT FORMATTER
   Turns one raw PawnMate physical-inventory export (.xls) into one
   print-ready audit workbook (.xlsx) with four tabs.
   Runs fully offline; no data leaves this computer.

   ALL REPORT RULES LIVE IN CONFIG BELOW. To change a column, heading,
   width, format, colour or page-header text, edit CONFIG only.
   ===================================================================== */
const APP = { name: 'Inventory Audit Report Formatter', version: '1.2.0' };

const CONFIG = {
  stores: ['BBP1', 'BBP2', 'BBP3', 'BBP4'],

  // Output file name. {store} = BBP1..BBP4, {date} = count date as mm-dd-yy
  fileName: '{store} INV AUDIT {date}.xlsx',

  // Rows whose Category 1 equals this (trimmed, any case) go to Commissary.
  // Everything else, including a blank Category 1, goes to Regular.
  commissaryCategory: 'Commissary',

  // Source tabs in the PawnMate export. Found by tab NAME and header TEXT,
  // never by position.
  sources: {
    disc: {
      tab: 'Inventory Discrepancy',
      dedupe: true,                 // keep first row per Scanned ID
      dateHeader: 'Date',           // used to find the count date
      required: ['Scanned ID', 'Description', 'Location', 'Selling Price', 'System Quantity',
                 'Physical Quantity', 'Difference', 'Cost Of Goods', 'Category 1'],
    },
    miss: {
      tab: 'In System But Not In Physical',
      dedupe: false,
      required: ['Scanned ID', 'Description', 'Location', 'Selling Price', 'System Quantity',
                 'Physical Quantity', 'Difference', 'Cost Of Goods', 'Category 1', 'Inventory Age'],
    },
  },
  // Fallback source for the count date if the Discrepancy tab has no dates.
  dateFallbackTab: 'Physical Inventory',

  // The four output tabs, in workbook order.
  // Printed page title = "{store} " + title, e.g. "BBP3 COMMISSARY MISSING INVENTORY"
  reports: [
    { key: 'regDisc', sheet: 'Reg Discrepancy', source: 'disc', commissary: false, title: 'REGULAR INVENTORY DISCREPANCY' },
    { key: 'regMiss', sheet: 'Reg Missing',     source: 'miss', commissary: false, title: 'REGULAR MISSING INVENTORY' },
    { key: 'comDisc', sheet: 'Com Discrepancy', source: 'disc', commissary: true,  title: 'COMMISSARY INVENTORY DISCREPANCY' },
    { key: 'comMiss', sheet: 'Com Missing',     source: 'miss', commissary: true,  title: 'COMMISSARY MISSING INVENTORY' },
  ],

  // Output columns, left to right.
  //   src      = PawnMate header text the value comes from
  //   type     = id | text | num | excog | blank
  //   only     = 'miss' or 'disc' to limit a column to one kind of tab
  columns: [
    { key: 'id',    head: 'Scanned ID',  src: 'Scanned ID',        width: 12, type: 'id',    numFmt: '0' },
    { key: 'desc',  head: 'Description', src: 'Description',       width: 50, type: 'text',  wrap: true },
    { key: 'loc',   head: 'Loc',         src: 'Location',          width: 8,  type: 'text' },
    { key: 'price', head: 'Price',       src: 'Selling Price',     width: 8,  type: 'num',   numFmt: '0.00' },
    { key: 'sys',   head: 'Sys Qty',     src: 'System Quantity',   width: 6,  type: 'num',   numFmt: '0' },
    { key: 'phy',   head: 'Phy Qty',     src: 'Physical Quantity', width: 6,  type: 'num',   numFmt: '0' },
    { key: 'diff',  head: 'Diff',        src: 'Difference',        width: 6,  type: 'num',   numFmt: '0' },
    { key: 'cog',   head: 'COG',         src: 'Cost Of Goods',     width: 8,  type: 'num',   numFmt: '0.00' },
    { key: 'excog', head: 'ExCOG',                                 width: 10, type: 'excog', numFmt: '0.00;[Red]-0.00' },
    { key: 'age',   head: 'Age',         src: 'Inventory Age',     width: 6,  type: 'num',   numFmt: '0', only: 'miss' },
    { key: 'found', head: 'Found ✓',                          width: 7,  type: 'blank', align: 'center' },
    { key: 'notes', head: 'Notes',                                 width: 18, type: 'blank', wrap: true },
  ],
  // ExCOG formula; {diff} and {cog} become that row's cell addresses.
  excogFormula: 'ROUND({diff}*{cog},2)',

  style: {
    font: { name: 'Arial', size: 10 },
    // Each tab is an Excel table in this built-in style (header fill and row
    // banding come from it). Medium 1 = black header, rows banded light gray /
    // white. Any name from Excel's Format as Table gallery works here.
    tableStyle: 'TableStyleMedium1',
    // Thin border drawn on every cell, header included, so the grid shows on
    // screen and on paper whatever borders the table style has.
    borderColor: '808080',
    // Header text colour. Must be set explicitly: Excel draws a header cell
    // whose font has no colour in black, not in the table style's colour.
    // Use 'FFFFFF' for styles with a dark header, '000000' for a light one.
    headerFontColor: 'FFFFFF',
    headerHeight: 27,          // pt (room for two-line headings like "Sys Qty")
    minRowHeight: 18,           // pt (room to write in Found / Notes)
    lineHeight: 12.75,          // pt per wrapped line of Arial 10
    charsPerWidthUnit: 1.0,     // used to estimate wrapped lines (conservative)
    negSysFill: 'FFF2CC',       // light yellow: negative System Qty row
    zeroCostFill: 'FCE4D6',     // light orange: $0 / blank cost cell (gray would vanish in the banding)
    emptyText: 'No items in this report.',
  },

  print: {
    orientation: 'landscape',
    paperSize: 1,               // Letter
    fitToWidth: 1,
    fitToHeight: 0,             // automatic tall
    margins: { left: 0.25, right: 0.25, top: 0.75, bottom: 0.75, header: 0.3, footer: 0.3 },
    printTitlesRow: '1:1',
    gridLines: true,
    // Font codes: size BEFORE name (&12&"Arial,Bold"), so text starting with a digit
    // (like the date) isn't read as part of the font size.
    headerTitleFont: '&12&"Arial,Bold"',
    headerSmallFont: '&10&"Arial,Regular"',
    footerSmallFont: '&8&"Arial,Regular"',
    headerRight: '{countDate}',            // e.g. 11/16/2026
    footerLeft: 'Generated {generated}',   // e.g. Generated 11/16/26 4:52 PM
    footerCenter: 'Page &P of &N',
  },
};
/* ===================== end of CONFIG ===================== */

/* ---------- helpers ---------- */
const norm = s => String(s == null ? '' : s).trim().toLowerCase().replace(/\s+/g, ' ');
const isBlank = v => v == null || String(v).trim() === '';
function toNum(v) {
  if (typeof v === 'number') return isFinite(v) ? v : null;
  if (isBlank(v)) return null;
  const n = parseFloat(String(v).replace(/[$,\s]/g, ''));
  return isFinite(n) ? n : null;
}
function toId(v) {
  if (typeof v === 'number') return Number.isInteger(v) ? v : Math.round(v);
  const s = String(v == null ? '' : v).trim();
  if (/^\d+(\.0+)?$/.test(s)) { const n = Number(s.split('.')[0]); if (Number.isSafeInteger(n)) return n; return s.split('.')[0]; }
  if (/^\d+(\.\d+)?e\+?\d+$/i.test(s)) { const n = Number(s); if (Number.isSafeInteger(n)) return n; }
  return s;
}
const cleanText = v => String(v == null ? '' : v).replace(/[\r\n]+/g, ' ').trim();
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const pad = n => String(n).padStart(2, '0');
const money = n => (n < 0 ? '−' : '') + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hfEsc = s => String(s).replace(/&/g, '&&');           // literal & in Excel header/footer
function colLetter(i) { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
const storage = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } },
};

class UserError extends Error {}

/* ---------- reading the PawnMate export ---------- */
function findSheet(wb, name) {
  const want = norm(name);
  const hit = wb.SheetNames.find(n => norm(n) === want);
  return hit ? wb.Sheets[hit] : null;
}

// Returns { headers: {normHeader: colIndex}, rows: [array,...] }
function readTable(wb, tabName, required) {
  const ws = findSheet(wb, tabName);
  if (!ws) throw new UserError(`This file has no tab named "${tabName}". Make sure it is the PawnMate physical-inventory export (inventory_count_###.xls).`);
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '', blankrows: true });
  // Header row: first row (within the top 15) that holds every required heading.
  let hRow = -1;
  for (let r = 0; r < Math.min(15, aoa.length); r++) {
    const set = new Set(aoa[r].map(norm));
    if (required.every(h => set.has(norm(h)))) { hRow = r; break; }
  }
  if (hRow < 0) {
    // Report which headings are missing, using the most complete candidate row.
    let best = [], bestHits = -1;
    for (let r = 0; r < Math.min(15, aoa.length); r++) {
      const set = new Set(aoa[r].map(norm));
      const hits = required.filter(h => set.has(norm(h))).length;
      if (hits > bestHits) { bestHits = hits; best = required.filter(h => !set.has(norm(h))); }
    }
    throw new UserError(`The "${tabName}" tab is missing ${best.length === 1 ? 'the column' : 'these columns'}: ${best.map(h => '"' + h + '"').join(', ')}.`);
  }
  const headers = {};
  aoa[hRow].forEach((h, i) => { const k = norm(h); if (k && !(k in headers)) headers[k] = i; });
  const rows = aoa.slice(hRow + 1).filter(r => r.some(v => !isBlank(v)));
  return { headers, rows };
}

function datePart(v) {
  if (typeof v === 'number') {               // Excel serial date
    const d = XLSX.SSF.parse_date_code(v);
    return d ? `${pad(d.m)}/${pad(d.d)}/${d.y}` : null;
  }
  const m = String(v || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (!m) return null;
  const y = m[3].length === 2 ? '20' + m[3] : m[3];
  return `${pad(m[1])}/${pad(m[2])}/${y}`;
}

function findCountDate(wb) {
  const counts = {};
  const tally = (tab, hdr) => {
    const ws = findSheet(wb, tab); if (!ws) return;
    const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
    for (let r = 0; r < Math.min(15, aoa.length); r++) {
      const idx = aoa[r].map(norm).indexOf(norm(hdr));
      if (idx >= 0) {
        for (const row of aoa.slice(r + 1)) { const d = datePart(row[idx]); if (d) counts[d] = (counts[d] || 0) + 1; }
        return;
      }
    }
  };
  tally(CONFIG.sources.disc.tab, CONFIG.sources.disc.dateHeader);
  if (!Object.keys(counts).length) tally(CONFIG.dateFallbackTab, 'Date');
  const best = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  return best ? best[0] : null;
}

/* ---------- processing ---------- */
function processExport(wb) {
  const warnings = [];   // {level:'warn'|'info', text, items?}
  const out = {};
  const comKey = norm(CONFIG.commissaryCategory);
  let blankCat = 0;
  const miscatItems = [];

  const sourceRows = {};
  for (const [skey, src] of Object.entries(CONFIG.sources)) {
    const { headers, rows } = readTable(wb, src.tab, src.required);
    const get = (row, h) => { const i = headers[norm(h)]; return i == null ? '' : row[i]; };

    let recs = rows.map(r => {
      const rec = { _cat: cleanText(get(r, 'Category 1')) };
      for (const c of CONFIG.columns) {
        if (c.only && c.only !== skey) continue;
        if (!c.src) continue;
        const raw = get(r, c.src);
        rec[c.key] = c.type === 'id' ? toId(raw) : c.type === 'num' ? toNum(raw) : cleanText(raw);
      }
      rec.excog = round2((rec.cog || 0) * (rec.diff || 0));
      return rec;
    });
    const sourceCount = recs.length;

    if (src.dedupe) {
      const first = new Map(), conflicts = new Map(), kept = [];
      let dropped = 0; const dupIds = new Set();
      for (const rec of recs) {
        const k = String(rec.id);
        if (isBlank(rec.id)) { kept.push(rec); continue; }
        if (!first.has(k)) { first.set(k, rec); kept.push(rec); continue; }
        const f = first.get(k);
        if ((f.diff || 0) !== (rec.diff || 0)) {
          kept.push(rec);
          if (!conflicts.has(k)) conflicts.set(k, [f]);
          conflicts.get(k).push(rec);
        } else { dropped++; dupIds.add(k); }
      }
      recs = kept;
      if (dropped) warnings.push({ level: 'info', text: `${src.tab}: ${sourceCount.toLocaleString()} rows became ${recs.length.toLocaleString()} after removing ${dropped} repeat scan${dropped === 1 ? '' : 's'} of ${dupIds.size} item${dupIds.size === 1 ? '' : 's'}.` });
      if (conflicts.size) warnings.push({
        level: 'warn',
        text: `${conflicts.size} Scanned ID${conflicts.size === 1 ? ' was' : 's were'} scanned more than once with different Difference values. All rows were kept; check these before the recount:`,
        items: [...conflicts.entries()].map(([k, list]) => `${k} — ${list[0].desc} (Diff: ${list.map(x => x.diff).join(', ')})`),
      });
    }
    sourceRows[skey] = recs;
    blankCat += recs.filter(r => r._cat === '').length;
  }

  for (const rep of CONFIG.reports) {
    const rows = sourceRows[rep.source]
      .filter(r => (norm(r._cat) === comKey) === rep.commissary)
      .slice()
      .sort((a, b) => a.excog - b.excog);          // biggest loss first (stable)
    rows.forEach(r => { r._negSys = (r.sys || 0) < 0; r._zeroCost = !r.cog; });
    const shortage = round2(rows.reduce((s, r) => s + (r.excog < 0 ? r.excog : 0), 0));
    const overage = round2(rows.reduce((s, r) => s + (r.excog > 0 ? r.excog : 0), 0));
    out[rep.key] = { rep, rows, shortage, overage, net: round2(shortage + overage) };

    const neg = rows.filter(r => r._negSys);
    if (neg.length) warnings.push({
      level: 'warn',
      text: `${rep.sheet}: ${neg.length} row${neg.length === 1 ? ' has' : 's have'} a negative System Qty (oversold). ${neg.length === 1 ? 'It is' : 'They are'} kept and highlighted yellow${rep.source === 'miss' ? '; a negative System Qty makes Diff positive, so these show as overage on a missing report' : ''}.`,
      items: neg.map(r => `${r.id} — ${r.desc} (Sys ${r.sys}, ExCOG ${money(r.excog)})`),
    });
    const zc = rows.filter(r => r._zeroCost).length;
    if (zc) warnings.push({ level: 'warn', text: `${rep.sheet}: ${zc} row${zc === 1 ? ' has' : 's have'} a $0 or blank cost, so ExCOG shows $0.00. The COG cell is shaded orange: the dollar impact is unknown, not zero.` });
    if (!rep.commissary) {
      rows.filter(r => /\bcommissary\b/i.test(r.desc)).forEach(r => miscatItems.push(`${rep.sheet}: ${r.id} — ${r.desc} (Category 1: ${r._cat || 'blank'})`));
    }
  }

  if (blankCat) warnings.push({ level: 'warn', text: `${blankCat} row${blankCat === 1 ? ' has' : 's have'} a blank Category 1 and ${blankCat === 1 ? 'was' : 'were'} placed on the Regular reports.` });
  if (miscatItems.length) warnings.push({
    level: 'info',
    text: `${miscatItems.length} item${miscatItems.length === 1 ? '' : 's'} on Regular ${miscatItems.length === 1 ? 'has' : 'have'} "Commissary" in the description but not as Category 1. The split uses Category 1 only, so consider re-categorizing ${miscatItems.length === 1 ? 'it' : 'these'} in PawnMate:`,
    items: miscatItems,
  });
  return { reports: out, warnings };
}

/* ---------- writing the audit workbook ---------- */
function estimateLines(text, width) {
  if (!text) return 1;
  const per = Math.max(1, Math.floor(width * CONFIG.style.charsPerWidthUnit));
  let lines = 1, cur = 0;
  for (const w of String(text).split(/\s+/)) {
    let len = w.length;
    if (cur === 0) { while (len > per) { lines++; len -= per; } cur = len; }
    else if (cur + 1 + len <= per) cur += 1 + len;
    else { lines++; while (len > per) { lines++; len -= per; } cur = len; }
  }
  return lines;
}

function fill(hex) { return { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF' + hex } }; }

async function buildWorkbook(result, meta) {
  const S = CONFIG.style, P = CONFIG.print;
  const wb = new ExcelJS.Workbook();
  const now = meta.generatedAt;
  wb.creator = `${APP.name} v${APP.version}`;
  wb.lastModifiedBy = wb.creator;
  wb.created = now; wb.modified = now;
  wb.title = meta.fileName.replace(/\.xlsx$/i, '');
  wb.subject = `${meta.store} inventory audit, count date ${meta.countDate}`;
  wb.description = `${APP.name} v${APP.version} | Source: ${meta.sourceName} | Generated: ${meta.generatedText}`;
  wb.keywords = 'inventory audit PawnMate';

  for (const rep of CONFIG.reports) {
    const { rows } = result.reports[rep.key];
    const cols = CONFIG.columns.filter(c => !c.only || c.only === rep.source);
    const addr = {}; cols.forEach((c, i) => addr[c.key] = colLetter(i));
    const ws = wb.addWorksheet(rep.sheet, {
      views: [{ state: 'frozen', xSplit: 0, ySplit: 1, topLeftCell: 'A2', activeCell: 'A2' }],
      properties: { defaultRowHeight: S.minRowHeight },
    });
    ws.columns = cols.map(c => ({ key: c.key, width: c.width, style: { font: { ...S.font } } }));

    // Write the report as an Excel table: the table style supplies the header,
    // banding, borders and filter buttons. An Excel table needs at least one
    // data row, so an empty report gets a single "No items" row.
    const values = rows.length
      ? rows.map((r, ri) => cols.map(c => {
          if (c.type === 'excog') {
            const rn = ri + 2;
            return { formula: CONFIG.excogFormula.replace('{diff}', addr.diff + rn).replace('{cog}', addr.cog + rn), result: r.excog };
          }
          if (c.type === 'blank') return null;
          const v = r[c.key];
          return (v === null || v === undefined || v === '') ? null : v;
        }))
      : [cols.map((c, i) => (i === 0 ? S.emptyText : null))];
    ws.addTable({
      name: rep.sheet.replace(/[^A-Za-z0-9]/g, ''),
      ref: 'A1',
      headerRow: true,
      totalsRow: false,
      style: { theme: S.tableStyle, showRowStripes: true, showColumnStripes: false, showFirstColumn: false, showLastColumn: false },
      columns: cols.map(c => ({ name: c.head, filterButton: true })),
      rows: values,
    });

    // Cell formatting on top of the table style. No fills here except the two
    // highlights, so the style's header fill and banding show through.
    const line = { style: 'thin', color: { argb: 'FF' + S.borderColor } };
    const box = { top: line, left: line, bottom: line, right: line };
    const hr = ws.getRow(1);
    cols.forEach((c, i) => {
      const cell = hr.getCell(i + 1);
      cell.font = { ...S.font, bold: true, color: { argb: 'FF' + S.headerFontColor } };
      cell.alignment = { wrapText: true, vertical: 'middle', horizontal: c.align || (c.type === 'num' || c.type === 'excog' ? 'right' : 'left') };
      cell.border = box;
    });
    hr.height = S.headerHeight;

    if (!rows.length) {
      cols.forEach((c, i) => { ws.getRow(2).getCell(i + 1).border = box; });
      ws.getCell('A2').font = { ...S.font, italic: true };
      ws.getRow(2).height = S.minRowHeight;
    }

    rows.forEach((r, ri) => {
      const row = ws.getRow(ri + 2);
      let maxLines = 1;
      cols.forEach((c, ci) => {
        const cell = row.getCell(ci + 1);
        if (c.type === 'id' && typeof r[c.key] === 'string') cell.numFmt = '@';
        else if (c.numFmt) cell.numFmt = c.numFmt;
        cell.font = { ...S.font };
        cell.border = box;
        cell.alignment = {
          vertical: 'top',
          wrapText: !!c.wrap,
          horizontal: c.align || (c.type === 'id' ? 'left' : undefined),
        };
        if (r._negSys) cell.fill = fill(S.negSysFill);
        if (c.key === 'cog' && r._zeroCost) cell.fill = fill(S.zeroCostFill);
        if (c.wrap) maxLines = Math.max(maxLines, estimateLines(cell.value == null ? '' : cell.value, c.width));
      });
      row.height = Math.max(S.minRowHeight, Math.ceil((maxLines * S.lineHeight + 3) * 4) / 4);
    });

    ws.pageSetup = {
      orientation: P.orientation, paperSize: P.paperSize,
      fitToPage: true, fitToWidth: P.fitToWidth, fitToHeight: P.fitToHeight,
      printTitlesRow: P.printTitlesRow, showGridLines: P.gridLines,
      horizontalCentered: false,
      margins: { ...P.margins },
    };
    const title = `${meta.store} ${rep.title}`;
    const fill_ = s => s.replace('{countDate}', meta.countDate).replace('{generated}', meta.generatedShort);
    ws.headerFooter = {
      differentFirst: false, differentOddEven: false,
      oddHeader: `&C${P.headerTitleFont}${hfEsc(title)}&R${P.headerSmallFont}${hfEsc(fill_(P.headerRight))}`,
      oddFooter: `&L${P.footerSmallFont}${hfEsc(fill_(P.footerLeft))}&C${P.headerSmallFont}${P.footerCenter}`,
    };
  }
  return wb.xlsx.writeBuffer();
}

/* ---------- UI ---------- */
const state = { saver: null, store: null, file: null, wb: null, result: null, countDate: null, selected: 'regDisc' };

function $(id) { return document.getElementById(id); }

function fmtGenerated(d) {
  let h = d.getHours(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
  return `${pad(d.getMonth() + 1)}/${pad(d.getDate())}/${String(d.getFullYear()).slice(2)} ${h}:${pad(d.getMinutes())} ${ap}`;
}
function outFileName() {
  if (!state.store || !state.countDate) return '';
  const [m, d, y] = state.countDate.split('/');
  return CONFIG.fileName.replace('{store}', state.store).replace('{date}', `${m}-${d}-${y.slice(2)}`);
}

function renderStores() {
  const box = $('stores');
  box.innerHTML = CONFIG.stores.map(s => `<button type="button" class="seg" role="radio" aria-checked="${s === state.store}" data-store="${s}">${s}</button>`).join('');
  box.querySelectorAll('button').forEach(b => b.onclick = () => {
    state.store = b.dataset.store; storage.set('iaf.store', state.store); renderStores(); renderAll();
  });
}

function showError(msg) {
  $('error').textContent = msg; $('error').hidden = !msg;
}

function renderAll() {
  const r = state.result;
  $('results').hidden = !r;
  const name = outFileName();
  const btn = $('download');
  btn.disabled = !(r && state.store);
  $('dlhint').textContent = !r ? '' : !state.store ? 'Pick the store above to name the workbook.' : name;
  if (!r) return;

  $('meta').innerHTML = `<strong>${esc(state.file.name)}</strong> &middot; count date ${esc(state.countDate || 'unknown')}`;

  $('cards').innerHTML = CONFIG.reports.map(rep => {
    const x = r.reports[rep.key];
    return `<button type="button" class="card ${state.selected === rep.key ? 'sel' : ''}" data-key="${rep.key}">
      <div class="card-h"><span>${esc(rep.sheet)}</span><span class="lines">${x.rows.length} line${x.rows.length === 1 ? '' : 's'}</span></div>
      <dl>
        <dt>Shortage</dt><dd class="neg">${money(x.shortage)}</dd>
        <dt>Overage</dt><dd class="pos">${money(x.overage)}</dd>
        <dt class="net">Net</dt><dd class="net ${x.net < 0 ? 'neg' : ''}">${money(x.net)}</dd>
      </dl></button>`;
  }).join('');
  $('cards').querySelectorAll('.card').forEach(c => c.onclick = () => { state.selected = c.dataset.key; renderAll(); });

  const w = r.warnings;
  $('warnings').innerHTML = w.length ? w.map(x => `<li class="${x.level}"><span>${esc(x.text)}</span>${x.items ? `<details><summary>Show ${x.items.length}</summary><ul>${x.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></details>` : ''}</li>`).join('') : '<li class="ok">No warnings.</li>';

  // Row preview for the selected report
  const x = r.reports[state.selected];
  const cols = CONFIG.columns.filter(c => (!c.only || c.only === x.rep.source) && c.type !== 'blank');
  $('preview-title').textContent = `${x.rep.sheet} — ${x.rows.length} line${x.rows.length === 1 ? '' : 's'}, biggest loss first`;
  const numCls = c => (c.type === 'num' || c.type === 'excog') ? ' class="n"' : '';
  const fmt = (c, v) => v == null || v === '' ? '' : c.type === 'excog' || c.numFmt === '0.00' ? Number(v).toFixed(2) : String(v);
  $('preview').innerHTML = `<thead><tr>${cols.map(c => `<th${numCls(c)}>${esc(c.head)}</th>`).join('')}</tr></thead><tbody>${
    x.rows.length ? x.rows.map(row => `<tr class="${row._negSys ? 'negsys' : ''}">${cols.map(c => {
      const v = c.type === 'excog' ? row.excog : row[c.key];
      const cls = [c.type === 'num' || c.type === 'excog' ? 'n' : '', c.type === 'excog' && v < 0 ? 'neg' : '', c.key === 'cog' && row._zeroCost ? 'zc' : ''].filter(Boolean).join(' ');
      return `<td${cls ? ` class="${cls}"` : ''}>${esc(fmt(c, v))}</td>`;
    }).join('')}</tr>`).join('') : `<tr><td colspan="${cols.length}"><em>${esc(CONFIG.style.emptyText)}</em></td></tr>`
  }</tbody>`;
}

async function handleFile(file) {
  showError('');
  state.file = null; state.result = null; renderAll();
  if (!file) return;
  if (!/\.(xls|xlsx)$/i.test(file.name)) { showError(`"${file.name}" isn't an Excel file. Drop the PawnMate .xls export.`); return; }
  $('drop').classList.add('busy');
  try {
    const buf = await file.arrayBuffer();
    let wb;
    try { wb = XLSX.read(buf, { type: 'array', cellDates: false }); }
    catch (e) { throw new UserError(`Couldn't open "${file.name}" as an Excel file. It may be damaged or still open in another program.`); }
    const result = processExport(wb);
    state.file = file; state.wb = wb; state.result = result;
    state.countDate = findCountDate(wb);
    if (!state.countDate) {
      const d = new Date(); state.countDate = `${pad(d.getMonth() + 1)}/${pad(d.getDate())}/${d.getFullYear()}`;
      result.warnings.unshift({ level: 'warn', text: `No scan dates were found in the file, so today's date (${state.countDate}) is used as the count date.` });
    }
    renderAll();
  } catch (e) {
    console.error(e);
    showError(e instanceof UserError ? e.message : `Something went wrong reading the file: ${e.message}`);
  } finally { $('drop').classList.remove('busy'); }
}

function dlMsg(text, bad) { const m = $('dlmsg'); m.textContent = text || ''; m.className = bad ? 'bad' : ''; }

// Hosted on claude.ai: files are saved through the platform's download prompt.
// Opened as a local file: window.claude doesn't exist, so a plain download is used.
function getSaver() {
  if (!window.claude || typeof window.claude.use !== 'function') return Promise.resolve(undefined);
  return window.claude.use('downloads').catch(() => null);
}

async function download() {
  if (!state.result || !state.store) return;
  dlMsg('');
  const btn = $('download'); btn.disabled = true; const label = btn.textContent; btn.textContent = 'Building…';
  try {
    const now = new Date();
    const meta = {
      store: state.store, countDate: state.countDate, fileName: outFileName(), sourceName: state.file.name,
      generatedAt: now, generatedShort: fmtGenerated(now), generatedText: now.toLocaleString('en-US'),
    };
    const buf = await buildWorkbook(state.result, meta);
    const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const saver = await state.saver;
    if (saver === undefined) {
      // Opened as a local file: a normal browser download.
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = meta.fileName;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      dlMsg(`Saved ${meta.fileName} to your Downloads folder.`);
    } else if (saver === null) {
      dlMsg('Saving files isn\u2019t available in this view. Open the page in a web browser and try again.', true);
    } else {
      try {
        await saver.save({ filename: meta.fileName, data: blob });
        dlMsg(`Saved ${meta.fileName}.`);
      } catch (err) {
        const code = err && err.code;
        if (code === 'declined') dlMsg('Download cancelled.');
        else if (code === 'rate_limited') dlMsg('A save prompt is already open. Finish that one first.', true);
        else dlMsg(`Couldn't save the workbook (${code || 'unknown error'}).`, true);
      }
    }
  } catch (e) {
    console.error(e); showError(`Couldn't build the workbook: ${e.message}`);
  } finally { btn.textContent = label; btn.disabled = false; }
}

document.addEventListener('DOMContentLoaded', () => {
  state.saver = getSaver();
  const saved = storage.get('iaf.store');
  if (CONFIG.stores.includes(saved)) state.store = saved;
  $('ver').textContent = `v${APP.version}`;
  renderStores();
  const drop = $('drop'), input = $('file');
  input.onchange = () => handleFile(input.files[0]);
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) handleFile(f); });
  // Stop a file dropped outside the box from navigating the page away.
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => e.preventDefault());
  $('download').onclick = download;
  renderAll();
});
</script>
